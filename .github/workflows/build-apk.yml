
name: Compilar APK Android

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xuper-configuracion-completa-build
  cancel-in-progress: false

jobs:
  build:
    name: Compilar XUPER IPTV
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Localizar Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          if [ ! -d "$SDK_ROOT" ]; then
            SDK_ROOT="/usr/local/lib/android/sdk"
          fi

          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error::No se encontró Android SDK."
            exit 1
          fi

          SDKMANAGER_PATH="$(find "$SDK_ROOT" \
            -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER_PATH" ]; then
            echo "::error::No se encontró sdkmanager."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER_PATH=$SDKMANAGER_PATH" >> "$GITHUB_ENV"

      - name: Aceptar licencias Android
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "$SDKMANAGER_PATH" \
            --sdk_root="$ANDROID_HOME" --licenses
          set -o pipefail

      - name: Instalar paquetes Android SDK
        shell: bash
        run: |
          set -euo pipefail

          "$SDKMANAGER_PATH" --sdk_root="$ANDROID_HOME" \
            "platform-tools"

          "$SDKMANAGER_PATH" --sdk_root="$ANDROID_HOME" \
            "platforms;android-35"

          "$SDKMANAGER_PATH" --sdk_root="$ANDROID_HOME" \
            "build-tools;35.0.0"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extraer y localizar proyecto
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/XUPER_RAPTOR_R7_IPTV_CONFIGURACION_COMPLETA_NO_COMPILADO.zip"
          EXTRACT_DIR="$RUNNER_TEMP/xuper-configuracion"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::No se encontró el ZIP esperado."
            find "$GITHUB_WORKSPACE" -maxdepth 2 \
              -type f -iname '*.zip' -print
            exit 1
          fi

          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          SETTINGS_FILE="$(find "$EXTRACT_DIR" -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::No se encontró settings.gradle ni settings.gradle.kts."
            find "$EXTRACT_DIR" -maxdepth 3 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] &&
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::No se encontró el módulo app."
            find "$PROJECT_DIR" -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto: $PROJECT_DIR"
          echo "ZIP original preservado."

      - name: Preparar compatibilidad JVM
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/jvm-compat.init.gradle" <<'GRADLE'
          gradle.projectsEvaluated {
              allprojects {
                  tasks.configureEach { task ->
                      if (task.name ==~ /compile.*Kotlin/) {
                          if (task.hasProperty("kotlinOptions")) {
                              task.kotlinOptions.jvmTarget = "1.8"
                          }
                      }
                  }
              }
          }
          GRADLE

          echo "Ajuste de destino Kotlin JVM 1.8 preparado."

      - name: Compilar APK Debug
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace \
              -I "$RUNNER_TEMP/jvm-compat.init.gradle" \
              assembleDebug
          else
            gradle --no-daemon --stacktrace \
              -I "$RUNNER_TEMP/jvm-compat.init.gradle" \
              assembleDebug
          fi

      - name: Verificar APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/debug"

          if [ ! -d "$APK_DIR" ]; then
            echo "::error::No se creó la carpeta del APK."
            exit 1
          fi

          APK_FILE="$(find "$APK_DIR" -maxdepth 1 \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "::error::No se encontró ningún APK."
            exit 1
          fi

          echo "APK generado:"
          ls -lh "$APK_FILE"

      - name: Publicar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: XUPER-CONFIGURACION-COMPLETA-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
